<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>My Builder Page</title>
    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>
<body>
    <header class="nav">
        <a 
            href="#home"
            class="logo"
            data-page="home">P
        </a>
<!--Home and Projects button for Navigation Bar Starts-->
        <nav>
            <button
                class="nav-link active"
                data-page="home">Home
            </button>
            <button
                class="nav-link"
                data-page="projects">Projects
            </button>
        </nav>
<!--Home and Projects button for Navigation Bar Ends-->
        <span class="nav-year">
            2026
        </span>
    </header>
<!--Body for the home stuff Starts-->
    <main>
        <section 
            class="page home active"
            id="home"
        >
            <div class="home-content">
                <p class="eyebrow">
                    Student · Builder
                </p>
                <h1> Hi! I'm Praneel. </h1>
                <p class="intro">
                    ...
                </p>
            </div>
        </section>
<!--Body for the home stuff Ends-->
<!--Body for the projects stuff Starts-->
        <section
            class="page projects"
            id="projects"
        >
            <div class="projects-content">
                <p class="eyebrow">My selected work</p>
                <h2>Projects</h2>
                <div class="project-list">
                    <button
                        class="project"
                        data-project="01">
                        <span class="project-number">
                            01
                        </span>

                        <span class="project-name">
                            Project 1
                        </span>

                        <span class="project-year">
                            2026
                        </span>
                    </button>
                    <button
                        class="project"
                        data-project="02">
                        <span class="project-number">
                            02
                        </span>

                        <span class="project-name">
                            Project 2
                        </span>

                        <span class="project-year">
                            2026
                        </span>
                    </button>
                    <button
                        class="project"
                        data-project="03">
                        <span class="project-number">
                            03
                        </span>

                        <span class="project-name">
                            Project 3
                        </span>

                        <span class="project-year">
                            2026
                        </span>
                    </button>
                    <button
                        class="project"
                        data-project="04">
                        <span class="project-number">
                            04
                        </span>

                        <span class="project-name">
                            Project 4
                        </span>

                        <span class="project-year">
                            2026
                        </span>
                    </button>
                </div>
            </div>
        </section>
    </main>
<!--Body for the projects stuff Ends-->
</body>
</html>
